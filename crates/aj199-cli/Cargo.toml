[package]
name = "aj199-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI aj199ctl для AJAZZ AJ199"

[[bin]]
name = "aj199ctl"
path = "src/main.rs"

[dependencies]
aj199-protocol = { path = "../aj199-protocol" }
aj199-device = { path = "../aj199-device" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
