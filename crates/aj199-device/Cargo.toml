[package]
name = "aj199-device"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Транспорт и поиск HID-интерфейсов AJAZZ AJ199"

[dependencies]
aj199-protocol = { path = "../aj199-protocol" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }

[target.'cfg(not(windows))'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["linux-static-hidraw"] }
